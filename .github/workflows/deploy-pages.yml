name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build static site
        run: bun run build
        env:
          GITHUB_PAGES_BUILD: "1"
          # A project site is served at https://<user>.github.io/<repo>/,
          # so the build must prefix all asset URLs with the repo name.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Prepare static site
        run: |
          mkdir -p dist/client
          cp -R .output/public/. dist/client/
          cp dist/client/index.html dist/client/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
